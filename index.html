<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نبض القلب السيبراني - Cybernetic Code Heart</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="matrix-bg" id="matrixBg"></div>
    <div class="cyber-grid"></div>

    <header class="cyber-header">
        <div class="logo-area">
            <span class="pulse-dot"></span>
            <h1>CYBER_HEART_ENGINE</h1>
        </div>
        <div class="status-badge">SYSTEM_STATUS: <span class="active-status">ONLINE [SECURE]</span></div>
    </header>

    <main class="main-container">
        <div class="canvas-wrapper">
            <canvas id="heartCanvas"></canvas>
            <div class="scanner-line"></div>
        </div>

        <aside class="control-panel">
            <div class="panel-header">
                <h2>لوحة التحكم الهندسية</h2>
                <span class="version-tag">v2.4.0</span>
            </div>

            <div class="control-group">
                <label for="colorTheme">تدرج الألوان السيبراني:</label>
                <select id="colorTheme">
                    <option value="neon-pink">نيون وردي فاقع (Neon Pink)</option>
                    <option value="cyber-blue">أزرق سيبراني (Cyber Blue)</option>
                    <option value="matrix-green">أخضر ماتركس (Matrix Green)</option>
                    <option value="gold-fire">ذهب ناري (Solar Gold)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="pulseSpeed">سرعة النبض: <span id="speedVal">1.0</span>x</label>
                <input type="range" id="pulseSpeed" min="0.2" max="3.0" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <label for="particleDensity">كثافة الجسيمات والأكواد:</label>
                <input type="range" id="particleDensity" min="500" max="3500" step="100" value="1800">
            </div>

            <div class="control-group">
                <label for="chaosLevel">مستوى التشتت (Chaos):</label>
                <input type="range" id="chaosLevel" min="0" max="100" step="1" value="15">
            </div>

            <div class="btn-grid">
                <button id="toggleMatrix" class="cyber-btn active">تشغيل تساقط الماتركس</button>
                <button id="toggleAudio" class="cyber-btn">تفعيل النبض الصوتي</button>
                <button id="resetView" class="cyber-btn warning">إعادة ضبط الكاميرا</button>
            </div>

            <div class="telemetry-box">
                <h3>بيانات القياس عن بعد (Telemetry)</h3>
                <div class="telemetry-row"><span>الجسيمات النشطة:</span> <span id="statParticles">0</span></div>
                <div class="telemetry-row"><span>معدل الإطارات:</span> <span id="statFps">60 FPS</span></div>
                <div class="telemetry-row"><span>طاقة النبض:</span> <span id="statEnergy">99.8%</span></div>
                <div class="telemetry-row"><span>معالج الأكواد:</span> <span id="statCore">SYNCHRONIZED</span></div>
            </div>
        </aside>
    </main>

    <footer class="cyber-footer">
        <p>مُطور خصيصاً بنظام هندسي فائق التفصيل | جميع الحقوق محفوظة © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
