<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LiquidOS Quantum Counter 100</title><link rel="stylesheet" href="styles.css"></head><body><div id="liquid-root" class="liquid-shell"><div class="mac-window-bar"><div class="mac-dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div><div class="mac-title">LiquidOS_Encrypted_Vault_v2.4</div></div><div class="workspace-content"><div class="counter-display-wrapper"><svg class="liquid-ring" viewBox="0 0 300 300"><circle class="ring-bg" cx="150" cy="150" r="130"></circle><circle class="ring-progress" id="liquidRingProgress" cx="150" cy="150" r="130"></circle></svg><div class="counter-inner-box"><span class="sub-label">العداد التفاعلي</span><h1 id="counterNumber">0</h1><span class="target-label">الهدف: 100</span></div></div><div class="control-station"><button id="quantumTriggerBtn" class="liquid-btn"><span class="btn-liquid-effect"></span><span class="btn-text">اضغط لزيادة العداد</span><span class="btn-subtext">+1 نبضة تشفير آمنة</span></button></div></div><footer class="liquid-footer"><div class="telemetry-box"><span>الحالة: <b id="vaultStatusText">مؤمّن (AES-256)</b></span><span>التوقيع: <b id="hashDisplay">0x0000</b></span></div><button id="resetVaultBtn" class="reset-link">إعادة تعيين</button></footer></div><div class="celebration-modal" id="celebrationModal" hidden><div class="mac-glass-card"><div class="celebration-emoji">🏆</div><h2>مبروك وصولك للرقم 100!</h2><p>تم توثيق إنجازك بنجاح داخل الخزنة المشفرة بنظام LiquidOS الفريد.</p><div class="modal-buttons"><button id="modalResumeBtn" class="mac-btn primary">متابعة العمل</button><button id="modalResetBtn" class="mac-btn secondary">بدء تحدٍ جديد</button></div></div></div><canvas id="particleCanvas"></canvas><script src="app.js"></script></body></html>
