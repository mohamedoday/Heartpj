<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="description" content="نظام عداد تفاعلي مشفر بتقنية AES-256-GCM مع محرك احتفالات فيزيائي">
    <title>العداد التفاعلي المشفر | Milestone 100</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- طبقة الكانفاس الخلفية لمحرك الفيزياء والاحتفالات -->
    <canvas id="celebrationCanvas" aria-hidden="true"></canvas>

    <!-- الحاوية الرئيسية للتطبيق -->
    <main class="app-shell" id="appShell">
        <header class="system-header">
            <div class="security-badge" id="securityStatus" title="حالة التشفير النشطة">
                <span class="status-dot"></span>
                <span class="status-text">AES-256-GCM ENCRYPTED VAULT</span>
            </div>
            <div class="hash-display" id="integrityHash" title="التوقيع الرقمي للحالة الحالية">
                HASH: 0x00000000
            </div>
        </header>

        <!-- قسم العداد المركزي فوق الزر -->
        <section class="counter-stage" aria-live="polite">
            <div class="progress-ring-container">
                <svg class="progress-ring" width="260" height="260" viewBox="0 0 260 260">
                    <circle class="progress-ring__background" cx="130" cy="130" r="115" />
                    <circle class="progress-ring__circle" id="progressRing" cx="130" cy="130" r="115" />
                </svg>
                <div class="counter-readout">
                    <span class="counter-label">العداد الحالي</span>
                    <div class="counter-value" id="counterDisplay">0</div>
                    <span class="counter-target">الهدف: 100</span>
                </div>
            </div>

            <!-- زر الضغط الأساسي -->
            <div class="action-zone">
                <button type="button" class="cyber-trigger-btn" id="incrementBtn" aria-label="زيادة العداد بمقدار واحد">
                    <span class="btn-glow"></span>
                    <span class="btn-content">
                        <span class="btn-title">اضغط هنا</span>
                        <span class="btn-subtitle">+1 نبضة مشفرة</span>
                    </span>
                </button>
            </div>
        </section>

        <!-- لوحة المؤشرات والتحكم السفلي -->
        <footer class="telemetry-footer">
            <div class="telemetry-item">
                <span class="t-label">نسبة الإنجاز</span>
                <span class="t-value" id="percentDisplay">0%</span>
            </div>
            <div class="telemetry-item">
                <span class="t-label">حالة المخزن</span>
                <span class="t-value" id="vaultStateDisplay">مؤمّن</span>
            </div>
            <button type="button" class="reset-btn" id="resetBtn" title="تصفير العداد وإعادة توليد مفاتيح التشفير">
                إعادة ضبط
            </button>
        </footer>
    </main>

    <!-- نافذة الاحتفالية المنبثقة عند الوصول إلى 100 -->
    <div class="celebration-overlay" id="celebrationModal" role="dialog" aria-modal="true" aria-labelledby="celebrationTitle" hidden>
        <div class="celebration-card">
            <div class="trophy-emblem">🏆</div>
            <h1 class="celebration-title" id="celebrationTitle">مبارك! لقد وصلت إلى 100 ضغطة!</h1>
            <p class="celebration-desc">
                تم تسجيل إنجازك وتوثيقه بنجاح داخل الخزنة المشفرة بنظام <code dir="ltr">AES-256-GCM</code>.
            </p>
            <div class="celebration-stats">
                <div class="stat-box">
                    <span class="stat-num">100 / 100</span>
                    <span class="stat-lbl">الهدف المكتمل</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num" id="completionTimeDisplay">0.0s</span>
                    <span class="stat-lbl">الزمن المستغرق</span>
                </div>
            </div>
            <div class="celebration-actions">
                <button type="button" class="celebrate-close-btn" id="closeCelebrationBtn">متابعة</button>
                <button type="button" class="celebrate-restart-btn" id="restartFromModalBtn">بدء تحدٍ جديد</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
